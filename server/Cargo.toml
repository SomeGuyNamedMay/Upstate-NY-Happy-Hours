# ./backend/Cargo.toml
[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
dotenvy = "0.15.7"
sqlx = { version = "0.8", default-features = false, features = ["mysql", "runtime-tokio-rustls", "derive", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
